[project]
name = "realtime-context-standard-demo"
version = "0.1.0"
description = "Northwind Outfitters support agent: Deepgram Flux, PhoneLLM Mini, Pipecat Tone"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[baseten,cartesia,daily,deepgram,elevenlabs,openai,runner,tone,webrtc]>=1.15.0",
    "pipecatcloud>=1.2.0",
    "typesafe-sdk>=0.7.5",
]

[dependency-groups]
dev = ["pipecat-ai[cli]", "pyright>=1.1.404,<2", "ruff>=0.12.11,<1"]

[tool.pyright]
# Copied as they are from pipecat-visemes and pipecat-vap, which don't type-check them
# (lipsync/README.md, backchannel/README.md).
exclude = [
    "lipsync",
    "backchannel/analyzer.py",
    "backchannel/decision.py",
    "backchannel/lexicon.py",
    "backchannel/model.py",
    ".venv",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]

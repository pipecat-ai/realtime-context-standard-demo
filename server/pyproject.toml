[project]
name = "realtime-context-standard-demo"
version = "0.1.0"
description = "Northwind Outfitters support agent: Deepgram Flux, PhoneLLM Mini, Pipecat Tone"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[baseten,cartesia,daily,deepgram,elevenlabs,openai,runner,tone,webrtc]",
    "pipecatcloud>=1.2.0",
]

[dependency-groups]
dev = ["pipecat-ai[cli]", "pyright>=1.1.404,<2", "ruff>=0.12.11,<1"]

# Pipecat Tone's rc1 models (pipecat-ai/pipecat#6407) and the reader's perception on
# RTVI user-input (#6418) are on main but not yet released. Drop this source and pin
# a release once they ship.
[tool.uv.sources]
pipecat-ai = { git = "https://github.com/pipecat-ai/pipecat.git", branch = "main" }

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
